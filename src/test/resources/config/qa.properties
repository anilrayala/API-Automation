# ---------------------------------------------------------------------------
# QA environment configuration
#
# Selected with -Denv=qa (the default). Add staging.properties / dev.properties
# alongside this file and switch with -Denv=staging; nothing in the Java code
# changes.
#
# Every value here can be overridden without editing the file:
#   1. -Dplaces.baseUrl=https://other.host      (highest priority)
#   2. an environment variable PLACES_BASEURL    (key upper-cased, '.' -> '_')
#   3. this file                                 (lowest priority)
#
# NEVER put a real secret in this file. It is committed. Secrets belong in
# environment variables -- see the "Secrets" section at the bottom.
# ---------------------------------------------------------------------------

