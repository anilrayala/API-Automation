# --- Framework behaviour ---------------------------------------------------
# Write full request/response traffic to target/logs/api-traffic.log
framework.logRequests = true
# Accept self-signed certificates. Needed by some practice endpoints.
framework.relaxedHttps = true
# Re-run a failed test this many times before reporting it as failed.
framework.retryCount = 1

